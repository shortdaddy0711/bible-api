name: Ingest ESV Bible Data (Daily)

on:
  schedule:
    - cron: '30 5 * * *'  # 05:30 UTC daily (resumable; ~75 req/day on free tier)
  workflow_dispatch:

jobs:
  ingest:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ESV ingestion
        run: |
          set -a
          source /root/app/.env
          set +a
          # supabase-kong resolves only inside the docker network; use the public endpoint
          export SUPABASE_URL=http://76.13.110.111:8000
          uv sync --frozen
          uv run python scripts/ingest_esv.py
